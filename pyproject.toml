[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "learningflow"
version = "0.1.0"
description = "ChatGPT-first long-term learning runtime"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2,<3",
]

[project.scripts]
learningflow-admin = "learningflow.admin:main"

[tool.setuptools.packages.find]
where = ["src"]
